name: Build X IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "URL to the decrypted X (Twitter) IPA file"
        default: ""
        required: true
        type: string

      display_name:
        description: "App Name (Optional)"
        default: "X"
        required: true
        type: string

      bundle_id:
        description: "Bundle ID (Optional)"
        default: "com.atebits.Tweetie2"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build IPA
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Hide Sensitive Inputs
        uses: levibostian/action-hide-sensitive-inputs@v1
        with:
          exclude_inputs: display_name,bundle_id

      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download and Validate IPA
        env:
          IPA_URL: ${{ inputs.ipa_url }}
        run: |
          download() {
            rm -f "$2"
            if wget --quiet --no-verbose --tries=3 --waitretry=2 -O "$2" "$1"; then
              return 0
            fi
            echo "::warning::wget failed for $2, retrying with curl"
            rm -f "$2"
            curl --fail --location --silent --show-error --retry 3 --retry-delay 2 -o "$2" "$1"
          }
          download "$IPA_URL" app.ipa
          file_type=$(file --mime-type -b app.ipa)
          if [[ "$file_type" != "application/x-ios-app" && "$file_type" != "application/zip" ]]; then
            echo "::error::Validation failed: The downloaded file is not a valid IPA. Detected type: $file_type."
            exit 1
          fi

      - name: Get App Version
        run: |
          plist_entry="$(unzip -Z1 app.ipa | grep -m1 -E '^Payload/[^/]+\.app/Info\.plist$' || true)"
          if [[ -z "$plist_entry" ]]; then
            echo "::error::Could not find app bundle in Payload/"
            exit 1
          fi
          plist_dir="$RUNNER_TEMP/appplist"
          mkdir -p "$plist_dir"
          unzip -q -j -o app.ipa "$plist_entry" -d "$plist_dir"
          version="$(plutil -extract CFBundleShortVersionString raw -o - "$plist_dir/Info.plist" | tr -d '\r\n' | tr -c 'A-Za-z0-9._+~-' '_')"
          rm -rf "$plist_dir"
          if [[ -z "$version" ]]; then
            echo "::error::Could not read CFBundleShortVersionString from the IPA's Info.plist"
            exit 1
          fi
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"

      - name: Install cyan
        run: |
          if ! command -v cyan &> /dev/null; then
            pipx install --force https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip
          fi

      - name: Inject Into IPA
        env:
          DISPLAY_NAME: ${{ inputs.display_name }}
          BUNDLE_ID_INPUT: ${{ inputs.bundle_id }}
        run: |
          TWEAK_PATH="resources/XEnhancer.dylib"

          if [[ ! -f "$TWEAK_PATH" ]]; then
            echo "::error::Tweak file $TWEAK_PATH not found!"
            exit 1
          fi

          bundle_id="${BUNDLE_ID_INPUT:-com.atebits.Tweetie2}"

          safe_name="$(printf '%s' "$DISPLAY_NAME" | tr ' ' '_' | tr -cd '[:alnum:]_.-')"
          if [[ -z "$safe_name" ]]; then
            safe_name="X"
          fi
          ipa_name="${safe_name}_${APP_VERSION}.ipa"

          cyan -i app.ipa \
            -o "$ipa_name" \
            -f "$TWEAK_PATH" \
            -n "$DISPLAY_NAME" \
            -b "$bundle_id"

          echo "IPA_NAME=$ipa_name" >> "$GITHUB_ENV"

      - name: Create a Draft Release
        env:
          GH_TOKEN: ${{ github.token }}
          DISPLAY_NAME: ${{ inputs.display_name }}
        run: |
          i=1
          while gh release view "x-ipa${i}" --repo "$GITHUB_REPOSITORY" &>/dev/null; do
            i=$(( i + 1 ))
          done
          gh release create "x-ipa${i}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "${DISPLAY_NAME}_${APP_VERSION}" \
            --draft \
            "$IPA_NAME"

      - name: Job Summary
        run: |
          {
            echo '### 🛠️ Build IPA Complete!'
            echo
            echo '### 🚀 Draft Release'
            echo
            echo "Draft release has been created successfully! You can view your release here: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases"
          } >> "$GITHUB_STEP_SUMMARY"
